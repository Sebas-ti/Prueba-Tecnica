[project]
name = "enterprise-rag-agent"
version = "1.0.0"
description = "Agente RAG empresarial sobre Azure (prueba técnica AI Developer Engineer - IC7)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008", "E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E402"]
"eval/*" = ["S"]
